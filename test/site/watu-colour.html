window.model = {}; window.touched = {};
document.querySelectorAll('[ngbdropdown]').forEach((dd) => {
  const anchor = dd.querySelector('[ngbdropdownanchor],[ngbdropdowntoggle]'); const menu = dd.querySelector('.dropdown-menu');
  if (!anchor || !menu) return;
  anchor.addEventListener('click', () => { menu.classList.toggle('show'); anchor.setAttribute('aria-expanded', menu.classList.contains('show')); });
  menu.querySelectorAll('li').forEach((li) => li.addEventListener('click', () => {
    const key = (dd.querySelector('label')||{}).textContent || 'dd';
    const cb = li.querySelector('input[type=checkbox]');
    if (cb) { cb.checked = !cb.checked; window.model[key] = [...menu.querySelectorAll('input:checked')].length + ' checked'; return; }
    const lab = dd.querySelector('.label'); if (lab) lab.textContent = li.textContent.trim();
    window.model[key] = li.textContent.trim(); menu.classList.remove('show'); anchor.setAttribute('aria-expanded', 'false'); }));
});
document.querySelectorAll('input:not([type=file])').forEach((i) => {
  const k = i.name || i.getAttribute('aria-label') || i.dataset.test || i.id;
  i.addEventListener('input', () => { window.model[k] = i.value; });
  i.addEventListener('change', () => { if (i.type === 'checkbox' || i.type === 'radio') window.model[k + (i.type==='radio'?'':'') ] = i.type==='radio' ? i.id : i.checked; });
  i.addEventListener('blur', () => { window.touched[k] = true; });
});
