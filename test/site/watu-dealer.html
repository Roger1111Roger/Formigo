<!doctype html><html><head><meta charset="utf-8"><style>.ng-hide{display:none!important}.chosen-drop{display:none}.chosen-with-drop .chosen-drop{display:block}
.dropdown-menu{display:none}.form-check input[type=checkbox]{position:absolute;opacity:0}.form-check label{display:inline-block;width:14px;height:14px;border:1px solid #333}
ngb-modal-window{position:fixed;inset:0;background:#0006;display:block;overflow:auto;z-index:1050}.modal-content{background:#fff;margin:30px auto;width:700px;padding:10px}</style></head><body><ngb-modal-window role="dialog" aria-modal="true" class="modal show"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">Add dealership</h4></div><div class="modal-body ng-star-inserted" style="max-height: calc(100vh - 130px); overflow: auto;"><form novalidate="" data-test="dealership-common-modal-form" class="ng-valid ng-dirty ng-touched"><div class="form-row"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-1">Dealership type</label></div><div class="form-group-body"><select data-test="dealership-common-modal-select-1" class="browser-default custom-select mb-4" style=""><!----><option value="1">Mother </option><option value="2">Shop </option></select></div><div class="message error"></div></div></div><!----><!----><div class="form-row ng-star-inserted"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-4">Dealership name</label></div><div class="form-group-body"><input name="dealershipName" data-test="dealership-common-modal-dealership-name-input" class="ng-valid ng-dirty ng-touched" style=""></div><div class="message error"></div></div></div><div class="form-row ng-star-inserted"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-5">Legal name</label></div><div class="form-group-body"><input name="companyName" data-test="dealership-common-modal-company-name-input" class="ng-valid ng-dirty ng-touched" style=""></div><div class="message error"></div></div></div><div class="form-row ng-star-inserted"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-6">Registration number</label></div><div class="form-group-body"><input name="registrationNumber" data-test="dealership-common-modal-registration-number-input" class="ng-valid ng-dirty ng-touched" style=""></div><div class="message error"></div></div></div><!----><!----><div class="form-row ng-star-inserted"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-8">Is active?</label></div><div class="form-group-body"><select data-test="dealership-common-modal-select-5" class="browser-default custom-select mb-4" style=""><!----><option value="true">Yes</option><option value="false">No</option></select></div><div class="message error"></div></div><div class="form-group ng-star-inserted"><div class="form-group-head"><label data-test="dealership-common-modal-label-9">Use regional price?</label></div><div class="form-group-body"><select data-test="dealership-common-modal-select-6" class="browser-default custom-select mb-4"><option value="true">Yes</option><option value="false">No</option></select></div><div class="message error"></div></div><div class="form-group ng-star-inserted"><div class="form-group-head"><label data-test="dealership-common-modal-label-10">Request photo with agent</label></div><div class="form-group-body"><select data-test="dealership-common-modal-select-7" class="browser-default custom-select mb-4"><!----><option value="true">Yes</option><option value="false">No</option></select></div><div class="message error"></div></div><!----></div><div style="display: flex;" class="ng-star-inserted"><div class="input-col" style="width: 66%;"><div class="form-row"><div class="form-group"><div class="form-check check-col"><span style="padding: 0;">Loan types</span></div></div><div class="form-group"><div class="form-check check-col"><span style="padding: 0;">Skip ETR</span></div></div></div><div class="form-row"><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-1"><label data-test="dealership-common-modal-label-11" style="padding-left: 20px;"></label><span style="padding: 0;">New</span></div></div><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-2"><label data-test="dealership-common-modal-label-12" style="padding-left: 20px;"></label></div></div></div><div class="form-row"><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-3"><label data-test="dealership-common-modal-label-13" style="padding-left: 20px;"></label><span style="padding: 0;">Repossessed</span></div></div><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-4" disabled=""><label data-test="dealership-common-modal-label-14" style="padding-left: 20px;"></label></div></div></div><div class="form-row"><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-5"><label data-test="dealership-common-modal-label-15" style="padding-left: 20px;"></label><span style="padding: 0;">Transferred</span></div></div><div class="form-group"><div class="form-check check-col"><input type="checkbox" data-test="dealership-common-modal-input-6" disabled=""><label data-test="dealership-common-modal-label-16" style="padding-left: 20px;"></label></div><div class="message error"></div></div></div></div><div class="input-col"><div class="form-row"><div class="form-group"><div class="form-check check-col"><span style="padding: 0;">Asset types</span></div></div></div><div class="form-row"><div class="form-group"><div class="form-check check-col" style="opacity: 1;"><input type="checkbox" data-test="dealership-common-modal-input-7"><label data-test="dealership-common-modal-label-17" style="padding-left: 20px;"></label><span style="padding: 0;">Mobile device</span></div></div></div><div class="form-row"><div class="form-group"><div class="form-check check-col" style="opacity: 1;"><input type="checkbox" data-test="dealership-common-modal-input-8"><label data-test="dealership-common-modal-label-18" style="padding-left: 20px;"></label><span style="padding: 0;">Home electronics</span></div></div></div></div></div><div class="form-row ng-star-inserted"><div class="form-group"><div class="form-group-head"><label data-test="dealership-common-modal-label-19">Dealership group</label></div><div class="form-group-body"><select data-test="dealership-common-modal-select-8" class="browser-default custom-select mb-4" style=""><option selected="" value=""> -- Not selected --</option><option value="3" class="ng-star-inserted"> IN</option><option value="4" class="ng-star-inserted"> OUT</option><!----></select></div><div class="message error"></div></div></div><!----><div class="form-button-row ng-star-inserted"><button type="submit" data-test="dealership-common-modal-button-2" class="btn btn-primary"><!----> Add </button><button type="button" data-test="dealership-common-modal-button-3" class="btn btn-secondary"> Close </button></div><!----><!----></form></div></div></ngb-modal-window><script>window.model={};
document.querySelectorAll('select[chosen]').forEach(sel=>{const c=sel.nextElementSibling;const a=c.querySelector('.chosen-single');const ul=c.querySelector('.chosen-results');
 a.addEventListener('mousedown',()=>{c.classList.toggle('chosen-with-drop');ul.innerHTML=[...sel.options].filter(o=>o.value).map(o=>'<li class="active-result" data-v="'+o.value+'">'+o.text+'</li>').join('');
  ul.querySelectorAll('li').forEach(li=>li.addEventListener('mouseup',()=>{sel.value=li.dataset.v;sel.dispatchEvent(new Event('change'));a.querySelector('span').textContent=li.textContent;c.classList.remove('chosen-with-drop');window.model[sel.id]=li.textContent;}));});});
document.querySelectorAll('input').forEach(i=>{const k=i.name||i.id||i.dataset.test;i.addEventListener('input',()=>{window.model[k]=i.value});i.addEventListener('change',()=>{if(i.type==='checkbox')window.model[k]=i.checked})});
document.querySelectorAll('select:not([chosen])').forEach(s=>s.addEventListener('change',()=>{window.model[s.id||s.dataset.test]=s.options[s.selectedIndex].text.trim()}));
</script></body></html>
