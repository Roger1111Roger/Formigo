<!doctype html><html lang="en"><head><meta charset="utf-8"><title>IMEI</title>
<style>.dropdown-menu{display:none}.dropdown-menu.show{display:block}.hidden{display:none}
ngb-modal-window{position:fixed;inset:0;background:#0006;display:block;overflow:auto;z-index:1050}.modal-content{background:#fff;margin:30px auto;width:700px;padding:10px}
.drawer{position:fixed;top:0;right:0;width:300px;height:100%;transform:translateX(110%);background:#eee}
.form-row{display:flex;gap:10px}.form-group{margin:4px}</style></head><body><form data-test="asset-filter-form"><div class="form-group"><div class="form-group-head"><label>Plate#</label></div><div class="form-group-body"><input name="filterPlate" placeholder="Input value"></div></div></form>
<div class="drawer" role="dialog"><h3>Filters</h3><input name="drawerSearch" placeholder="Search"><input name="drawerCity" placeholder="City"></div>
<ngb-modal-window role="dialog" aria-modal="true" class="modal show"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">Register asset</h4></div><div class="modal-body"><form data-test="asset-register-modal-form-form"><div class="form-group ic-r"><div class="form-group-head"><label data-test="asset-register-modal-form-label-4">*Device IMEI #1</label></div><div class="form-group-body"><input name="plate" data-test="asset-register-modal-form-plate-input" class="ng-untouched ng-valid ng-dirty"><i class="warning default">!</i></div><div class="message error"></div></div><div class="form-group ic-r"><div class="form-group-head"><label data-test="asset-register-modal-form-label-6">*Model code</label></div><div class="form-group-body"><input name="engine" data-test="asset-register-modal-form-engine-input" class="ng-untouched ng-valid ng-dirty"><i class="warning default">!</i></div><div class="message error"></div></div></form></div></div></ngb-modal-window><script>
window.model = {}; window.touched = {};
document.querySelectorAll('[ngbdropdown]').forEach((dd) => {
  const anchor = dd.querySelector('[ngbdropdownanchor],[ngbdropdowntoggle]'); const menu = dd.querySelector('.dropdown-menu');
  if (!anchor || !menu) return;
  anchor.addEventListener('click', () => { menu.classList.toggle('show'); anchor.setAttribute('aria-expanded', menu.classList.contains('show')); });
  menu.querySelectorAll('li').forEach((li) => li.addEventListener('click', () => {
    const key = (dd.querySelector('label')||{}).textContent || 'dd';
    const cb = li.querySelector('input[type=checkbox]');
    if (cb) { cb.checked = !cb.checked; window.model[key] = [...menu.querySelectorAll('input:checked')].length + ' checked'; return; }
    const lab = dd.querySelector('.label'); if (lab) lab.textContent = li.textContent.trim();
    window.model[key] = li.textContent.trim(); menu.classList.remove('show'); anchor.setAttribute('aria-expanded', 'false'); }));
});
document.querySelectorAll('input:not([type=file])').forEach((i) => {
  const k = i.name || i.getAttribute('aria-label') || i.dataset.test || i.id;
  i.addEventListener('input', () => { window.model[k] = i.value; });
  i.addEventListener('change', () => { if (i.type === 'checkbox' || i.type === 'radio') window.model[k + (i.type==='radio'?'':'') ] = i.type==='radio' ? i.id : i.checked; });
  i.addEventListener('blur', () => { window.touched[k] = true; });
});
</script></body></html>
