<!doctype html><html><head><meta charset="utf-8"><title>Demo CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:#eef0f3;color:#1f2933}
.top{height:52px;background:#fff;border-bottom:1px solid #dde1e6;display:flex;align-items:center;padding:0 24px;gap:10px;font-weight:600}
.top i{width:22px;height:22px;border-radius:6px;background:#8a96a3;display:inline-block}
.wrap{max-width:880px;margin:24px auto;padding:0 24px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#6b7682;margin:0 0 18px}
.card{background:#fff;border:1px solid #dde1e6;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 14px;color:#3e4c59}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}.g2{grid-column:span 2}.g3{grid-column:1/-1}
label{display:block;font-size:12px;color:#52606d;margin-bottom:5px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #cbd2d9;border-radius:7px;background:#fff;color:#1f2933}
textarea{height:60px;resize:none}
.dz{border:1.5px dashed #b6bfc8;border-radius:10px;padding:14px;text-align:center;color:#6b7682;position:relative}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer}
.files{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;background:#f3f5f7;border-radius:7px;padding:6px 10px;font-size:13px;text-align:left}
.file b{font-weight:600;flex:1}.file span{color:#6b7682}.ext{font:600 10px monospace;background:#8a96a3;color:#fff;border-radius:4px;padding:2px 5px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:#3e4c59}
.btn{background:#3e4c59;color:#fff;border:0;border-radius:7px;padding:9px 18px;font:inherit}
</style></head><body>
<div class="top"><i></i><span data-t="app"></span></div>
<div class="wrap">
<h1 data-t="h1"></h1><p class="sub" data-t="sub"></p>
<form>
<div class="card"><h2 data-t="person"></h2><div class="g">
<div><label for="fn" data-t="fn"></label><input id="fn" name="firstName"></div>
<div><label for="ln" data-t="ln"></label><input id="ln" name="lastName"></div>
<div><label for="bd" data-t="bd"></label><input id="bd" name="birthDate" type="date"></div>
<div><label for="em" data-t="em"></label><input id="em" name="email" type="email"></div>
<div><label for="ph" data-t="ph"></label><input id="ph" name="phone" type="tel"></div>
<div><label for="gn" data-t="gn"></label><select id="gn" name="gender"><option value="" data-t="choose"></option><option data-t="male"></option><option data-t="female"></option></select></div>
</div></div>
<div class="card"><h2 data-t="work"></h2><div class="g">
<div class="g2"><label for="co" data-t="co"></label><input id="co" name="company"></div>
<div><label for="jt" data-t="jt"></label><input id="jt" name="jobTitle"></div>
<div><label for="ct" data-t="ct"></label><input id="ct" name="city"></div>
<div class="g2"><label for="ad" data-t="ad"></label><input id="ad" name="address"></div>
<div><label for="cc" data-t="cc"></label><input id="cc" name="cardNumber"></div>
<div><label for="ib" data-t="ib"></label><input id="ib" name="iban"></div>
<div><label for="zp" data-t="zp"></label><input id="zp" name="zip"></div>
</div></div>
<div class="card"><h2 data-t="docs"></h2><div class="g">
<div><label data-t="contract"></label><div class="dz"><span data-t="pdf"></span><input type="file" name="contract" accept="application/pdf"><div class="files"></div></div></div>
<div><label data-t="price"></label><div class="dz"><span data-t="xlsx"></span><input type="file" name="price" accept=".xlsx,.xls"><div class="files"></div></div></div>
<div><label data-t="photo"></label><div class="dz"><span data-t="img"></span><input type="file" name="avatar" accept="image/png,image/jpeg"><div class="files"></div></div></div>
<div class="g3"><label for="nt" data-t="nt"></label><textarea id="nt" name="comment"></textarea></div>
<div class="g3 chk"><input type="checkbox" id="ag" name="agree"><label for="ag" style="margin:0" data-t="agree"></label></div>
</div></div>
<button class="btn" type="button" data-t="save"></button>
</form></div>
<script>
const T={ru:{app:'Демо CRM',h1:'Новый клиент',sub:'Заполните карточку клиента',person:'Личные данные',fn:'Имя',ln:'Фамилия',bd:'Дата рождения',em:'Электронная почта',ph:'Телефон',gn:'Пол',choose:'Выберите',male:'Мужской',female:'Женский',work:'Работа и оплата',co:'Компания',jt:'Должность',ct:'Город',ad:'Адрес',cc:'Номер карты',ib:'IBAN',zp:'Индекс',docs:'Документы',contract:'Договор',pdf:'PDF до 5 МБ',price:'Прайс-лист',xlsx:'Таблица Excel',photo:'Фото клиента',img:'JPG или PNG',nt:'Комментарий',agree:'Согласен с условиями обработки данных',save:'Сохранить'},
en:{app:'Demo CRM',h1:'New customer',sub:'Fill in the customer card',person:'Personal details',fn:'First name',ln:'Last name',bd:'Date of birth',em:'Email',ph:'Phone',gn:'Gender',choose:'Choose',male:'Male',female:'Female',work:'Work and billing',co:'Company',jt:'Job title',ct:'City',ad:'Address',cc:'Card number',ib:'IBAN',zp:'ZIP code',docs:'Documents',contract:'Contract',pdf:'PDF up to 5 MB',price:'Price list',xlsx:'Excel spreadsheet',photo:'Customer photo',img:'JPG or PNG',nt:'Comment',agree:'I agree to the data processing terms',save:'Save'}};
const L=T[new URLSearchParams(location.search).get('lang')||'en'];document.documentElement.lang=new URLSearchParams(location.search).get('lang')||'en';
document.querySelectorAll('[data-t]').forEach(n=>n.textContent=L[n.dataset.t]);
document.querySelectorAll('.dz input').forEach(i=>i.addEventListener('change',()=>{const box=i.parentElement.querySelector('.files');box.innerHTML='';[...i.files].forEach(f=>{const d=document.createElement('div');d.className='file';d.innerHTML=`<span class="ext">${f.name.split('.').pop().toUpperCase()}</span><b></b><span>${Math.max(1,Math.round(f.size/1024))} KB</span>`;d.querySelector('b').textContent=f.name;box.append(d)});i.parentElement.querySelector('span').style.display='none';}));
</script></body></html>
