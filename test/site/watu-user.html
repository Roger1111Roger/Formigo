<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Add user</title></head><body>
<div class="modal-content"><user-add-modal-form><div class="modal-header"><h4 class="modal-title">Add user</h4></div><div class="modal-body"><form novalidate>
<div class="form-row-group"><div class="form-row"><div class="form-group"><div class="form-group-head"><label>*Username</label></div><div class="form-group-body"><input name="username" placeholder="Enter username"></div></div></div>
<div class="form-row"><div class="form-group"><div class="form-group-head"><label>*First name</label></div><div class="form-group-body"><input name="firstName" placeholder="Enter first name"></div></div>
<div class="form-group"><div class="form-group-head"><label>*Last name</label></div><div class="form-group-body"><input name="lastName" placeholder="Enter lastName"></div></div></div>
<div class="form-row"><div class="form-group"><div class="form-group-head"><label>*Email</label></div><div class="form-group-body"><input type="email" name="email" placeholder="Enter email"></div></div></div>
<div class="form-row"><div class="form-group"><div class="form-group-head"><label>*Password</label></div><div class="form-group-body"><input type="password" name="password" placeholder="Enter password"></div></div>
<div class="form-group"><div class="form-group-head"><label>*Password confirmation</label></div><div class="form-group-body"><input type="password" name="passwordConfirmation" placeholder="Enter password confirmation"></div></div></div>
<div class="form-row"><div class="form-group"><div class="form-group-head"><label>Department</label></div><div class="form-group-body"><select id="dep"><option disabled selected> -- Select department -- </option><option value="1"> Back Office </option><option value="9"> IT </option></select></div></div></div>
</div><button type="submit">Add</button></form></div></user-add-modal-form></div>
</body></html>
