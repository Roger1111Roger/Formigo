<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Formigo</title>
<link rel="stylesheet" href="theme.css">
<style>
body{width:288px;padding:10px 12px 12px;background:var(--bg);font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.brand img{width:20px;height:20px}
.icon{padding:3px 5px;border-color:transparent;background:transparent;color:var(--muted);line-height:1}
.icon:hover{background:var(--surface-2);color:var(--text)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.actions button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:6px 9px;line-height:1.3;min-width:0}
.actions button span{max-width:100%;overflow-wrap:anywhere}
.actions button:not(.primary){justify-content:space-between}
.actions button.primary{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 10px}
.actions kbd{color:var(--muted);font-size:10px}
.actions button.primary kbd{color:inherit;opacity:.75;font-size:11px}
.opts{margin:10px 0 0;padding:9px 0 0;border-top:1px solid var(--border);display:grid;gap:7px}
.check{display:flex;gap:7px;align-items:center;cursor:pointer}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.field select{width:auto;max-width:150px;padding:4px 6px;font-size:12px}
#status{margin-top:6px;font-size:12px;color:var(--success)}
#status:empty{display:none}
</style></head><body>
<header>
  <div class="brand"><img src="icons/logo.svg" alt="">Formigo</div>
  <div><button class="icon" id="theme" title=""><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button><button class="icon" id="opts" data-i18n-title="popup.settings"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
</header>
<div class="actions">
  <button class="primary" data-a="fillAll"><span data-i18n="popup.fillAll"></span><kbd data-k="fillAll"></kbd></button>
  <button data-a="fillForm"><span data-i18n="popup.fillForm"></span><kbd data-k="fillForm"></kbd></button>
  <button data-a="fillField"><span data-i18n="popup.fillField"></span><kbd data-k="fillField"></kbd></button>
  <button data-a="pick" data-i18n-title="popup.pickTitle"><span data-i18n="popup.pick"></span><kbd data-k="pick"></kbd></button>
  <button data-a="debug"><span data-i18n="popup.debug"></span><kbd data-k="debug"></kbd></button>
</div>
<div class="opts">
  <label class="check"><input type="checkbox" id="refill"><span data-i18n="popup.refill"></span></label>
  <label class="field"><span data-i18n="locale"></span><select id="locale"></select></label>
</div>
<div id="status"></div>
<script src="popup.js"></script>
</body></html>
